<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Enter your details - Birth Date</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#FAF8F0',
              yellow: '#F6DB43',
              dark: '#2D3134',
              muted: '#A5A6A8',
              faded: '#CBCAC6',
              selection: 'rgba(235, 233, 224, 0.75)'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Prevent text selection to emulate native app feel */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* Native-like wheel fade gradients */
    .wheel-mask {
      mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0,0,0,0.2) 12%, 
        rgba(0,0,0,0.6) 28%, 
        rgba(0,0,0,1) 42%, 
        rgba(0,0,0,1) 58%, 
        rgba(0,0,0,0.6) 72%, 
        rgba(0,0,0,0.2) 88%, 
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0,0,0,0.2) 12%, 
        rgba(0,0,0,0.6) 28%, 
        rgba(0,0,0,1) 42%, 
        rgba(0,0,0,1) 58%, 
        rgba(0,0,0,0.6) 72%, 
        rgba(0,0,0,0.2) 88%, 
        transparent 100%
      );
    }
  </style>
</head>
<body class="bg-[#FAF8F0] text-brand-dark min-h-screen flex justify-center items-start antialiased font-sans">
<!-- BEGIN: MobileDeviceContainer -->
<div class="w-full max-w-[420px] min-h-screen flex flex-col justify-between px-6 pt-3 pb-8 relative" data-purpose="mobile-frame">
<!-- Top Section (Status bar, Navigation header, Stepper, Title) -->
<div>
<!-- BEGIN: iOSStatusBar -->
<div class="w-full flex justify-between items-center pt-2 pb-3 px-1" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[17px] font-semibold tracking-tight text-[#1A1A1A]">8:57</span>
<!-- Status Icons -->
<div class="flex items-center space-x-1.5 text-[#1A1A1A]">
<!-- Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.2.2-.2.51 0 .71.1.1.23.15.35.15s.26-.05.35-.15l1.83-1.83C8.42 19.34 10.13 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7s-3.13 7-7 7c-1.58 0-3.04-.53-4.22-1.42l1.66-1.66c.77.37 1.64.58 2.56.58 3.04 0 5.5-2.46 5.5-5.5S15.04 7.5 12 7.5c-1.15 0-2.22.36-3.11.97l-1.45-1.45C8.8 6.38 10.33 5 12 5z" opacity="0"></path>
<path d="M2 17h2v4H2v-4zm4-4h2v8H6v-8zm4-4h2v12h-2V9zm4-5h2v17h-2V4zm4-4h2v21h-2V0z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.55 0 6.78 1.41 9.17 3.71L12 18.38 2.83 11.21C5.22 8.91 8.45 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-[25px] h-[12.5px] border border-black/80 rounded-[4px] p-[1.5px] flex items-center relative">
<div class="bg-black/80 h-full w-[65%] rounded-[1.5px]"></div>
<div class="absolute -right-[3px] top-[2.5px] w-[2px] h-[5.5px] bg-black/80 rounded-r-[1px]"></div>
</div>
<span class="text-[10px] font-bold ml-1 text-black/80">19</span>
</div>
</div>
</div>
<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationHeader -->
<header class="relative flex items-center justify-center py-3 mb-6" data-purpose="navigation-header">
<!-- Back Button -->
<button aria-label="Go back" class="absolute left-0 w-11 h-11 rounded-full bg-[#EAE8DE]/80 hover:bg-[#E2DFD4] transition-colors flex items-center justify-center focus:outline-none" type="button">
<svg class="w-5 h-5 text-zinc-700 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Header Title -->
<h1 class="text-[20px] font-semibold text-[#1C1F22] tracking-normal">
          Enter your details
        </h1>
</header>
<!-- END: NavigationHeader -->
<!-- BEGIN: ProgressIndicator -->
<nav aria-label="Progress steps" class="flex items-center justify-between px-2 mb-10" data-purpose="stepper">
<!-- Step 1: Completed -->
<div class="w-6 h-6 rounded-full bg-[#F5D839] flex items-center justify-center shadow-xs"></div>
<!-- Step 2: Completed -->
<div class="w-6 h-6 rounded-full bg-[#F5D839] flex items-center justify-center shadow-xs"></div>
<!-- Step 3: Active (Calendar) -->
<div class="w-8 h-8 rounded-full bg-[#F5D839] flex items-center justify-center shadow-sm">
<!-- Calendar Icon -->
<svg class="w-4 h-4 text-stone-800" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
<circle cx="8" cy="14" fill="currentColor" r="0.8"></circle>
<circle cx="12" cy="14" fill="currentColor" r="0.8"></circle>
<circle cx="16" cy="14" fill="currentColor" r="0.8"></circle>
<circle cx="8" cy="18" fill="currentColor" r="0.8"></circle>
<circle cx="12" cy="18" fill="currentColor" r="0.8"></circle>
<circle cx="16" cy="18" fill="currentColor" r="0.8"></circle>
</svg>
</div>
<!-- Step 4: Pending -->
<div class="w-6 h-6 rounded-full bg-[#E5E3D8]"></div>
<!-- Step 5: Pending -->
<div class="w-6 h-6 rounded-full bg-[#E5E3D8]"></div>
<!-- Step 6: Pending -->
<div class="w-6 h-6 rounded-full bg-[#E5E3D8]"></div>
</nav>
<!-- END: ProgressIndicator -->
<!-- Main Heading -->
<h2 class="text-[30px] font-bold text-[#3B4045] leading-tight mb-8">
        Enter your birth date
      </h2>
<!-- BEGIN: DateWheelPicker -->
<div class="relative w-full max-w-[370px] mx-auto my-6 h-[290px] flex items-center justify-center overflow-hidden wheel-mask" data-purpose="ios-wheel-picker">
<!-- Selection Highlight Bar -->
<div class="absolute w-full h-[52px] bg-[#EDE9DA]/85 rounded-2xl pointer-events-none z-0"></div>
<!-- Wheel Columns Container -->
<div class="w-full flex justify-between items-center z-10 text-center select-none px-4">
<!-- Day Column -->
<div class="flex-1 flex flex-col items-center leading-none" data-purpose="wheel-day">
<span class="text-[17px] py-[7px] text-[#C4C2BA] font-normal opacity-30">15</span>
<span class="text-[18px] py-[7px] text-[#A6A49C] font-normal opacity-60">16</span>
<span class="text-[20px] py-[7px] text-[#787771] font-normal opacity-85">17</span>
<span class="text-[22px] py-[6px] text-[#555655] font-normal">18</span>
<!-- Selected Day -->
<span class="text-[26px] py-[7px] text-[#22252A] font-semibold tracking-tight">19</span>
<span class="text-[22px] py-[6px] text-[#555655] font-normal">20</span>
<span class="text-[20px] py-[7px] text-[#787771] font-normal opacity-85">21</span>
<span class="text-[18px] py-[7px] text-[#A6A49C] font-normal opacity-60">22</span>
<span class="text-[17px] py-[7px] text-[#C4C2BA] font-normal opacity-30">23</span>
</div>
<!-- Month Column -->
<div class="flex-[1.4] flex flex-col items-center leading-none" data-purpose="wheel-month">
<span class="text-[17px] py-[7px] text-[#C4C2BA] font-normal opacity-30">May</span>
<span class="text-[18px] py-[7px] text-[#A6A49C] font-normal opacity-60">June</span>
<span class="text-[20px] py-[7px] text-[#787771] font-normal opacity-85">July</span>
<span class="text-[22px] py-[6px] text-[#555655] font-normal">August</span>
<!-- Selected Month -->
<span class="text-[26px] py-[7px] text-[#22252A] font-semibold tracking-tight">September</span>
<span class="text-[22px] py-[6px] text-[#555655] font-normal">October</span>
<span class="text-[20px] py-[7px] text-[#787771] font-normal opacity-85">November</span>
<span class="text-[18px] py-[7px] text-[#A6A49C] font-normal opacity-60">December</span>
<span class="text-[17px] py-[7px] text-[#C4C2BA] font-normal opacity-30">January</span>
</div>
<!-- Year Column -->
<div class="flex-1 flex flex-col items-center leading-none" data-purpose="wheel-year">
<span class="text-[17px] py-[7px] text-[#C4C2BA] font-normal opacity-30">2002</span>
<span class="text-[18px] py-[7px] text-[#A6A49C] font-normal opacity-60">2003</span>
<span class="text-[20px] py-[7px] text-[#787771] font-normal opacity-85">2004</span>
<span class="text-[22px] py-[6px] text-[#555655] font-normal">2005</span>
<!-- Selected Year -->
<span class="text-[26px] py-[7px] text-[#22252A] font-semibold tracking-tight">2006</span>
<span class="text-[22px] py-[6px] text-[#555655] font-normal">2007</span>
<span class="text-[20px] py-[7px] text-[#787771] font-normal opacity-85">2008</span>
<span class="text-[18px] py-[7px] text-[#A6A49C] font-normal opacity-60">2009</span>
<span class="text-[17px] py-[7px] text-[#C4C2BA] font-normal opacity-30">2010</span>
</div>
</div>
</div>
<!-- END: DateWheelPicker -->
</div>
<!-- BEGIN: BottomActionSection -->
<footer class="w-full pt-4 pb-2" data-purpose="bottom-cta-container">
<button class="w-full h-[58px] bg-[#F7DC43] hover:bg-[#ebd039] active:scale-[0.99] transition-all rounded-[18px] flex items-center justify-center text-[19px] font-semibold text-[#1E2124] shadow-sm tracking-wide focus:outline-none focus:ring-2 focus:ring-[#F7DC43] focus:ring-offset-2" data-purpose="next-button" type="button">
        Next
      </button>
</footer>
<!-- END: BottomActionSection -->
</div>
<!-- END: MobileDeviceContainer -->
</body></html>
